name: Java CI with Maven

on:
  push:
    branches:
      - master
      - VGA-28_multiple_delete_endpoints
  pull_request:
    branches:
      - master
      - VGA-28_multiple_delete_endpoints

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: Dev
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Set environment variables from secrets
        run: echo "KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }}" >> $GITHUB_ENV
      - name: Build with Maven
        run: mvn -B package --file pom.xml