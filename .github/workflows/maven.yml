# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches:
      - master
      - VGA-28_multiple_delete_endpoints
  pull_request:
    branches:
      - master
      - VGA-28_multiple_delete_endpoints

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -X -B package --file pom.xml
      - name: Display Surefire Reports
        run: cat /home/runner/work/project-valhalla-gabriela/project-valhalla-gabriela/access-control-service/target/surefire-reports/*.txt