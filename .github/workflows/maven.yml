name: Project Valhalla Gabriela - Build

on:
  push:
    branches:
      - master
      - VGA-6_delete_businessfunction_VGA-7_cascade_delete_businessfunction
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Build with Maven
        run: mvn clean install