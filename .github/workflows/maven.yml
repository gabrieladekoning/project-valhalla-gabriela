name: Project Valhalla Gabriela - Build

on:
  push:
    branches:
      - master
      - VGA-6_delete_businessfunction_VGA-7_cascade_delete_businessfunction

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'

      - name: Build with Maven
        run: mvn clean install