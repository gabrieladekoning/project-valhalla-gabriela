version: '3.9'
services:
  db:
    image: mysql:8.0.33
    env_file: .env
    container_name: mysql_access_control
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:root}
      MYSQL_DATABASE: access-control
      MYSQL_USER: ${MYSQL_USER:admin:admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:admin}
    ports:
      - "3307:3306"
    volumes:
      - devoteam_data:/var/lib/mysql

volumes:
  devoteam_data: