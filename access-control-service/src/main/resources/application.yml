server:
  port: 8090

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: access-control-service
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/access-control?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8180/auth/}realms/${KEYCLOAK_REALM:application-users}
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

jwt:
  auth:
    converter:
      resource-id: user-authentication-client
      principle-attribute: preferred_username

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180/auth/}
  realm: ${KEYCLOAK_REALM:application-users}
  client-id: ${KEYCLOAK_CLIENT_ID:access-control-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}