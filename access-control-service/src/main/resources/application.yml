server:
  port: 8090

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: access-control-service
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://mysql_db:3306/access-control?useSSL=false&createDatabaseIfNotExist=true}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update