server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: access-control-service
          uri: lb://access-control-service
          predicates:
            - Path=/access-control-service/**
          filters:
            - StripPrefix=1
        - id: demo
          uri: lb://demo
          predicates:
            - Path=/demo/**
          filters:
            - StripPrefix=1
        - id: access-control-service-swagger
          uri: lb://access-control-service
          predicates:
            - Path=/access-control-service/swagger-ui.html
        - id: demo-swagger
          uri: lb://demo
          predicates:
            - Path=/demo/swagger-ui.html